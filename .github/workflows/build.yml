# Builds and tests every push and pull request: the shared logic's tests on the JVM, its compile for iOS, and the
# Android debug APK. The machine this project is often written on can't download the Android SDK, so this is where
# the Android build is checked. Actions are pinned by commit, as in journal-client-kmp.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # The runner's preinstalled SDK (ANDROID_HOME), its licenses accepted; the Android Gradle plugin downloads the
      # platform (compileSdk 37) it needs. android-actions/setup-android failed installing the removed "tools" package.
      - name: Accept the Android SDK licenses
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test the shared logic
        run: ./gradlew :sharedLogic:testAndroidHostTest --continue

      # Kotlin/Native compiles the shared logic for iOS on Linux too (no Mac needed for this part): common code that
      # only the JVM accepts is caught here, on every push. The iOS app itself is built by ios.yml, on a Mac.
      - name: Compile the shared logic for iOS
        run: ./gradlew :sharedLogic:compileKotlinIosSimulatorArm64

      - name: Build the debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Lint the app
        run: ./gradlew :androidApp:lintDebug

      - name: Test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: sharedLogic/build/test-results/
          if-no-files-found: ignore

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: talk-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
