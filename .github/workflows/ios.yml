# Builds the iOS app for the simulator on one of GitHub's Macs: the shared Kotlin framework, libsignal's Swift
# package and the SwiftUI app. By hand only for now (Actions › iOS › Run workflow): while the iOS app is being built
# it is compiled on the owner's Mac, and this runs on pushes again once the app is stable (hen, 2026-11-28). Common
# code that stops compiling for iOS is caught on every push by build.yml's Linux job.
name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # libsignal's Swift source needs Swift 6.2 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The iOS app's words are written from the Android app's (tools/ios-strings.py): they must be current.
      - name: Check the iOS strings
        run: |
          python3 tools/ios-strings.py
          git diff --exit-code -- iosApp/Talk/Resources || {
            echo "::error::strings.xml changed: run python3 tools/ios-strings.py and commit what it writes"
            exit 1
          }

      # The Rust half of libsignal is a download from Signal's build server; the package pins its checksum, so a
      # changed file fails the build here, before Xcode fetches it. For a new version, the checksum this prints is
      # the one to pin, after comparing it with the release on GitHub.
      - name: Check libsignal's framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package=iosApp/Packages/LibSignalFfi/Package.swift
          url=$(grep -o 'https://build-artifacts[^"]*' "$package")
          tag=$(echo "$url" | sed -E 's/.*-build-(v[0-9.]+)\.xcframework\.zip/\1/')
          curl -fsSL -o "$RUNNER_TEMP/ffi.zip" "$url"
          sum=$(swift package compute-checksum "$RUNNER_TEMP/ffi.zip")
          echo "The download's checksum: $sum"
          if gh api "repos/signalapp/libsignal/releases/tags/$tag" --jq '.body, (.assets[] | .name + " " + (.digest // ""))' | grep -q "$sum"; then
            echo "Signal's release $tag names it."
          else
            echo "::notice::Signal's release $tag doesn't name the framework's checksum; the pin is what guards it."
          fi
          grep -q "$sum" "$package" || {
            echo "::error::$package pins another checksum than $tag's download has: $sum"
            exit 1
          }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # The shared module is an Android library too, so Gradle wants the SDK's licenses accepted to configure it.
      - name: Accept the Android SDK licenses
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Write the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build the app for the simulator
        run: |
          xcodebuild -version
          xcodebuild build \
            -project iosApp/Talk.xcodeproj -scheme Talk -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              grep -E "error:|error :|FAILED|What went wrong" -A4 "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400 | head -500
              tail -30 "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400
              exit 1
            }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: talk-simulator-app
          path: ${{ runner.temp }}/derived/Build/Products/Debug-iphonesimulator/Talk.app
