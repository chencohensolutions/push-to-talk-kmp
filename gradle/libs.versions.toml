# The same versions as journal-client-kmp (Nov 21, 2026); only what phase 1 uses. Add an entry back from there when a
# phase needs it, at journal's version.
[versions]
media3 = "1.8.0"
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "35"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-compose = "1.12.1"
androidx-compose-material3 = "1.5.0-alpha22"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"
play-services-code-scanner = "16.1.0"
# Phase 3: FCM wake-ups (news-client-kmp's version).
firebase-bom = "34.0.0"
# Add contact: this phone's QR code (ZXing's encoder only, as journal's invite code).
zxing-core = "3.5.3"
# Phase 5a: a burst that wakes a sleeping phone plays in a Telecom talk session (the plan's R1).
core-telecom = "1.1.0"
work = "2.12.0"
tflite-play = "16.5.0"
car-app = "1.7.0"
# Phase 5b: the live talk path (LiveKit's client, with its WebRTC), and phase 6's calls.
livekit = "2.30.0"
# Phase 2: libsignal from Signal's own Maven repository (settings.gradle.kts), pinned; upgrades are deliberate.
libsignal = "0.108.5"
sqlcipher-android = "4.20.0"
androidx-sqlite = "2.7.0"
desugar-jdk-libs = "2.1.5"
apollo = "5.2.0"
apollo-engine-ktor = "1.0.0-alpha.0"
junit = "4.13.2"
# Instrumented tests on a phone or an emulator (androidApp/src/androidTest).
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.3.3"
okhttp = "5.3.2"
okio = "3.16.4"

[libraries]
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# The /ws frames (relay/Frames.kt) and what travels inside the ciphertext (messaging/Content.kt).
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
apollo-runtime = { module = "com.apollographql.apollo:apollo-runtime", version.ref = "apollo" }
apollo-engine-ktor = { module = "com.apollographql.ktor:apollo-engine-ktor", version.ref = "apollo-engine-ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
libsignal-android = { module = "org.signal:libsignal-android", version.ref = "libsignal" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher-android" }
# sqlcipher-android lists androidx.sqlite only as a runtime dependency, but its SQLiteDatabase extends SupportSQLiteDatabase.
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
livekit-android = { module = "io.livekit:livekit-android", version.ref = "livekit" }
mlkit-face-detection = { module = "com.google.mlkit:face-detection", version = "16.1.7" }
core-telecom = { module = "androidx.core:core-telecom", version.ref = "core-telecom" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
play-services-tflite-java = { module = "com.google.android.gms:play-services-tflite-java", version.ref = "tflite-play" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "car-app" }
androidx-car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "car-app" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
# Enrollment: scans the server's QR code with Google's scanner screen (no camera permission).
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "play-services-code-scanner" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }

[plugins]
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
