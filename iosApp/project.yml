# The Xcode project, written by XcodeGen (brew install xcodegen; then `xcodegen` in this folder). Talk.xcodeproj is
# not committed: this file is the project. The app is SwiftUI over the shared Kotlin logic (../sharedLogic, the
# SharedLogic framework Gradle builds before each compile) and libsignal's Swift package.
name: Talk
options:
  bundleIdPrefix: com.chencohen
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  # The Signal protocol, as on Android (libs.versions.toml's libsignal): the same release in both.
  libsignal:
    url: https://github.com/signalapp/libsignal
    exactVersion: 0.108.5
  # The Rust half of libsignal, prebuilt by Signal; its package pins the download's checksum.
  LibSignalFfi:
    path: Packages/LibSignalFfi
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.33"
    CURRENT_PROJECT_VERSION: "1"
    # Gradle writes into ../sharedLogic/build from the build phase below.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # The shared framework is built for Apple silicon simulators only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Talk:
    type: application
    platform: iOS
    sources:
      - path: Talk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chencohen.ptt
        PRODUCT_NAME: Talk
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Talk/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedLogic/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedLogic -lsqlite3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: libsignal
        product: LibSignalClient
      - package: LibSignalFfi
        product: LibSignalFfi
    preBuildScripts:
      - name: Build the shared Kotlin logic
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sharedLogic:embedAndSignAppleFrameworkForXcode
schemes:
  Talk:
    build:
      targets:
        Talk: all
    run:
      config: Debug
    archive:
      config: Release
