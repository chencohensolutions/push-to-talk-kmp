# Live talk and calls (phases 5b and 6; the server's docs/messaging.md, "Live talk" and "Calls"). Called by
# ApolloMessagingApi.

mutation TalkToken($peer: String, $group: ID) {
  talkToken(peer: $peer, group: $group) { token room identity path expiresAt }
}

mutation CallToken($call: ID!, $peer: String, $group: ID) {
  callToken(call: $call, peer: $peer, group: $group) { token room identity path expiresAt }
}

query LiveTalk {
  serverInfo { liveTalk }
}

# Keeping a call on the server while someone records it (docs/screens/calls.md, "Recording").
mutation RecordCall($call: ID!, $peer: String, $group: ID) {
  recordCall(call: $call, peer: $peer, group: $group) { recording by }
}

mutation StopRecordingCall($call: ID!, $peer: String, $group: ID) {
  stopRecordingCall(call: $call, peer: $peer, group: $group) { recording by }
}

# A kept call's tracks, for playing it (docs/screens/calls.md, "Playing a kept call").
query CallRecording($call: ID!, $peer: String, $group: ID) {
  callRecording(call: $call, peer: $peer, group: $group) {
    recording
    tracks { blob identity kind codec startedAt recordingStartedAt size complete }
  }
}

# A kept call's event log: how this phone shows each video, and its camera's rotation (docs/screens/calls.md).
mutation LogCallEvent($call: ID!, $peer: String, $group: ID, $event: String!) {
  logCallEvent(call: $call, peer: $peer, group: $group, event: $event)
}
