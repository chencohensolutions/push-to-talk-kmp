# The connection check: the smallest query that needs this device's certificate (checkConnection).
query Me {
  me { user deviceNumber deviceName }
}

# Who the server is and where, kept after each connection (ServerHttp.refreshServerInfo).
query ServerInfo {
  serverInfo {
    version
    caCertificate
    deviceNumber
    discovery { fingerprint id key addresses }
  }
}

# Whether the server keeps calls while someone records, asked on its own: an older server doesn't know the field.
query KeepsCalls {
  serverInfo { keepsCalls }
}

# The server's CA on its own, asked at enrollment when enrollDevice didn't give it.
query ServerCa {
  serverInfo { caCertificate }
}
